name: Backend container runtime

on:
  workflow_dispatch:
  push:
    branches:
      - codex/container-runtime-verification
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.backend
      - scripts/start_backend_service.sh
      - scripts/start_backend_api.sh
      - scripts/check_backend_storage.sh
      - tests/test_backend_service_startup.py
      - scripts/verify_backend_container.py
      - .github/workflows/backend-container-runtime.yml

permissions:
  contents: read

jobs:
  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            port: 8002
          - dockerfile: Dockerfile.backend
            port: 8080
    steps:
      - uses: actions/checkout@v4
      - name: Build restricted-user backend
        run: docker build --file "${{ matrix.dockerfile }}" --tag civora-container-proof .
      - name: Verify fresh and restored volume
        shell: bash
        run: |
          set -euo pipefail
          docker volume create civora-proof-data
          cleanup() {
            docker rm --force civora-blocked-proof >/dev/null 2>&1 || true
            docker rm --force civora-proof >/dev/null 2>&1 || true
            docker volume rm civora-proof-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p container-evidence
          test "$(docker image inspect --format '{{.Config.User}}' civora-container-proof)" = '10001:10001'
          # Disposable CI volume only. Neither image may start against a mount
          # unavailable to UID 10001, or silently change its ownership.
          # Keep the volume nonempty so Docker copy-up cannot reinitialize its
          # metadata from the image's /data directory on the next attachment.
          docker run --rm --user 0:0 --volume civora-proof-data:/data --entrypoint sh civora-container-proof -c 'touch /data/permission-fixture && chown 0:0 /data && chmod 700 /data'
          docker run --rm --user 0:0 --volume civora-proof-data:/data --entrypoint sh civora-container-proof -c 'stat -c "%u %g %a" /data' > container-evidence/storage-mode.txt
          test "$(cat container-evidence/storage-mode.txt)" = '0 0 700'
          if timeout 30s docker run --name civora-blocked-proof --volume civora-proof-data:/data civora-container-proof > container-evidence/blocked-storage.txt 2>&1; then
            echo 'Backend unexpectedly started with inaccessible storage.' >&2
            exit 1
          else
            status=$?
            cat container-evidence/blocked-storage.txt
            echo "Blocked-storage exit: $status"
            docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' civora-blocked-proof
            test "$status" -eq 1
            grep -q 'Civora startup blocked' container-evidence/blocked-storage.txt
          fi
          docker rm civora-blocked-proof
          docker run --rm --user 0:0 --volume civora-proof-data:/data --entrypoint sh civora-container-proof -c 'test "$(stat -c %u /data)" = 0 && chown 10001:10001 /data'
          for phase in fresh restored; do
            docker run --detach --name civora-proof --volume civora-proof-data:/data \
              --env CIVORA_PRODUCT_MODE=private_alpha --env CIVORA_AI_PROVIDER=none \
              --env CIVORA_AI_VISUALIZATION_PROVIDER=none --env CIVORA_IMAGERY_DETECTION_PROVIDER=none \
              civora-container-proof
            if ! docker exec civora-proof python scripts/verify_backend_container.py --port "${{ matrix.port }}" --phase "$phase" | tee "container-evidence/$phase.json"; then
              docker logs civora-proof
              exit 1
            fi
            docker stop civora-proof
            docker rm civora-proof
          done
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-container-${{ matrix.port }}-${{ github.sha }}
          path: container-evidence
          if-no-files-found: error
