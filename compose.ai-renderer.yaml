services:
  civora-ai-renderer:
    build:
      context: .
      dockerfile: Dockerfile.ai-renderer
    ports:
      - "127.0.0.1:${CIVORA_RENDERER_PORT:-8091}:${CIVORA_RENDERER_PORT:-8091}"
    environment:
      PORT: "${CIVORA_RENDERER_PORT:-8091}"
      CIVORA_PRODUCT_MODE: "production"
      CIVORA_RENDERER_ENGINE: "diffusers"
      CIVORA_RENDERER_SERVICE_TOKEN: "${CIVORA_RENDERER_SERVICE_TOKEN:?set a renderer service token with at least 32 characters}"
      CIVORA_RENDERER_MODEL_LICENSE_ACKNOWLEDGED: "${CIVORA_RENDERER_MODEL_LICENSE_ACKNOWLEDGED:?review the model license and set true to continue}"
      CIVORA_RENDERER_EAGER_LOAD: "true"
      CIVORA_RENDERER_USE_DEPTH_CONTROL: "true"
      HF_HOME: "/models/huggingface"
    gpus: all
    shm_size: "2gb"
    volumes:
      - civora-renderer-model-cache:/models
    restart: unless-stopped

volumes:
  civora-renderer-model-cache:
